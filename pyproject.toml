[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[project]
name = "docpilot"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "httpx>=0.27",
    "python-multipart>=0.0.9",
    "numpy>=1.26",
]

[project.optional-dependencies]
parse  = ["pypdf>=4.0"]              # 文档解析
bm25   = ["rank-bm25>=0.2.2"]        # 混合检索
vector = ["chromadb>=0.4.24"]        # 真实向量库
graph  = ["langgraph>=0.0.40", "grandalf>=0.8"]   # Agent 编排（grandalf 供 draw_ascii() 用）
eval   = ["ragas>=0.1.5"]            # 评测
trace  = ["langfuse>=3.0"]           # 调用链追踪（第 12 步 ⑥）
cache  = ["redis>=5.0"]              # 缓存
all    = ["pypdf>=4.0", "rank-bm25>=0.2.2", "chromadb>=0.4.24",
          "langgraph>=0.0.40", "langchain-core>=0.1.40", "grandalf>=0.8",
          "langfuse>=3.0", "redis>=5.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
